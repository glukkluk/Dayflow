{% extends "base.html" %}
{% block title %}Вхід — OnTime{% endblock %}
{% block content %}
<p class="dashboard-eyebrow">Ваш особистий простір</p>
<h1>З поверненням!</h1>
<p class="auth-intro">Увійдіть, щоб продовжити планувати свій день.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Увійти</button>
</form>
<p class="auth-footer">Ще немає акаунту? <a href="{% url 'accounts:register' %}">Зареєструватися</a></p>
{% endblock %}
