{% extends "base.html" %}
{% block title %}{{ title }} — Особистий розклад{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
{% if note %}<p>{{ note }}</p>{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Зберегти</button>
    <a href="{% url cancel_url %}">Скасувати</a>
</form>
{% endblock %}
