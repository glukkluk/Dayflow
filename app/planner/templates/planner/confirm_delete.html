{% extends "base.html" %}
{% block title %}{{ title }} — Особистий розклад{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p>Ви впевнені, що хочете видалити «{{ object }}»?</p>
{% if note %}<p>{{ note }}</p>{% endif %}
<form method="post">
    {% csrf_token %}
    <button type="submit">Підтвердити видалення</button>
    <a href="{% url cancel_url %}">Скасувати</a>
</form>
{% endblock %}
